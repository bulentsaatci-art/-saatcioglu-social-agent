name: Send approved content to Buffer

on:
  push:
    paths:
      - 'approved/*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-to-buffer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find latest approved JSON
        id: latest
        shell: bash
        run: |
          FILE=$(find approved -maxdepth 1 -type f -name '*.json' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2-)
          if [ -z "$FILE" ]; then
            echo "No approved JSON file found"
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Using $FILE"

      - name: Send approved item to Buffer as draft
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        shell: bash
        run: |
          set +e
          OUTPUT=$(python3 scripts/send_to_buffer.py "${{ steps.latest.outputs.file }}" 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ $STATUS -ne 0 ]; then
            ONE_LINE=$(printf '%s' "$OUTPUT" | tail -n 25 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Buffer diagnostic::$ONE_LINE"
            exit $STATUS
          fi
