name: Send approved content to Buffer

on:
  push:
    paths:
      - 'approved/*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-to-buffer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find approved JSON from triggering commit
        id: latest
        shell: bash
        run: |
          FILE=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^approved/[^/]+\.json$' | tail -1)
          if [ -z "$FILE" ]; then
            FILE=$(find approved -maxdepth 1 -type f -name '*.json' -print 2>/dev/null | sort | tail -1)
          fi
          if [ -z "$FILE" ]; then
            echo "No approved JSON file found"
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Using triggering file: $FILE"
          cat "$FILE"

      - name: Send approved item to Buffer as draft
        id: buffer
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        shell: bash
        run: |
          set +e
          OUTPUT=$(python3 scripts/send_to_buffer.py "${{ steps.latest.outputs.file }}" 2>&1)
          STATUS=$?
          printf '%s\n' "$OUTPUT" | tee buffer-output.log
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          if [ $STATUS -ne 0 ]; then
            ONE_LINE=$(printf '%s' "$OUTPUT" | tail -n 25 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Buffer diagnostic::$ONE_LINE"
          fi
          exit $STATUS

      - name: Write run status to repository
        if: always()
        shell: bash
        run: |
          mkdir -p status
          {
            echo "run_sha=$GITHUB_SHA"
            echo "approved_file=${{ steps.latest.outputs.file }}"
            echo "exit_code=${{ steps.buffer.outputs.exit_code }}"
            echo "timestamp_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "--- output ---"
            if [ -f buffer-output.log ]; then
              tail -n 40 buffer-output.log
            else
              echo "No buffer output log"
            fi
          } > status/last-run.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/last-run.txt
          git commit -m "Update Buffer run status" || true
          git push || true

      - name: Mark job failed when Buffer step failed
        if: steps.buffer.outputs.exit_code != '0'
        run: exit 1
