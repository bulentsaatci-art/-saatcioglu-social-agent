name: Send approved content to Buffer

on:
  push:
    paths:
      - 'approved/*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-to-buffer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find latest approved JSON
        id: latest
        shell: bash
        run: |
          FILE=$(find approved -maxdepth 1 -type f -name '*.json' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2-)
          if [ -z "$FILE" ]; then
            echo "No approved JSON file found"
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Using $FILE"

      - name: Send approved item to Buffer as draft
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/send_to_buffer.py "${{ steps.latest.outputs.file }}"
