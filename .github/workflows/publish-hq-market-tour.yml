name: Publish HQ market tour

on:
  push:
    paths:
      - 'publish-trigger/hq-market-tour-20260823.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: pip install pillow

      - name: Assemble, validate, publish and record result
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/publish_hq_market_tour.py
