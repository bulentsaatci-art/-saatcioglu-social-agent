name: Verify HQ Market Tour Publish

on:
  push:
    paths:
      - 'publish-trigger/market-tour-hq-verify.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read publish status and create success marker
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('status/published-hq-market-tour-v2.json')
          if not p.exists():
              raise SystemExit('status file missing')
          d=json.loads(p.read_text())
          post=(d.get('buffer_result') or {}).get('post') or {}
          ok=bool(d.get('published')) and post.get('status')=='sent' and bool(post.get('externalLink'))
          if not ok:
              raise SystemExit('publish not confirmed: '+json.dumps(d,ensure_ascii=False))
          Path('status/hq-market-tour-live.txt').write_text(
              'published=true\nstatus=sent\nexternalLink='+post['externalLink']+'\npostId='+str(post.get('id',''))+'\n', encoding='utf-8')
          print(post['externalLink'])
          PY

      - name: Commit live marker
        run: |
          git config user.name "Saatcioglu Social Agent"
          git config user.email "actions@users.noreply.github.com"
          git add status/hq-market-tour-live.txt
          git diff --cached --quiet && exit 0
          URL=$(grep '^externalLink=' status/hq-market-tour-live.txt | cut -d= -f2-)
          git commit -m "HQ_MARKET_TOUR_LIVE $URL"
          git pull --rebase
          git push
