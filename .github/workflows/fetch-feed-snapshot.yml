name: Fetch Instagram feed snapshot

on:
  push:
    paths:
      - 'audit-trigger/*.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Buffer/Instagram feed snapshot
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/fetch_feed_snapshot.py

      - name: Commit snapshot
        shell: bash
        run: |
          git config user.name "Saatcioglu Social Agent"
          git config user.email "actions@users.noreply.github.com"
          git add status/feed-snapshot.json
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "Update Instagram feed snapshot"
          git push
