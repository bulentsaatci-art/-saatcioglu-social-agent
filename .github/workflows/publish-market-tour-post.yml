name: Publish premium market tour post

on:
  push:
    paths:
      - 'publish-trigger/market-tour-post.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish image post
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/publish_market_tour_post.py

      - name: Commit publish status
        if: always()
        shell: bash
        run: |
          if [ -f status/published-market-tour-post.json ]; then
            git config user.name "Saatcioglu Social Agent"
            git config user.email "actions@users.noreply.github.com"
            git add status/published-market-tour-post.json
            git diff --cached --quiet || git commit -m "Record market tour publish result"
            git push || true
          fi
