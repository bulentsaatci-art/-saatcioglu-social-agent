name: Publish HQ Market Tour

on:
  push:
    paths:
      - 'publish-trigger/market-tour-hq.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install quality-check dependency
        run: |
          python3 -m pip install --upgrade pip
          pip install pillow

      - name: Publish verified HQ post
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/publish_market_tour_hq.py
